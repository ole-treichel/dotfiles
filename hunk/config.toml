theme = "oxide-dark"

# Oxide themes for hunk. Palette: oxide/colors.txt. The `theme` line above is
# rewritten in place by theme-cli (oxide-dark | oxide-light).
# Generated from the oxidescheme/vscode token map. hunk appends syntax_scopes
# after the base Shiki theme's rules, so every selector of the base is
# overridden with the oxide color of its innermost scope.
#
# `base` choice: text without a token color (plain-text and unknown file
# types, every line before highlighting finishes) is drawn with the base
# theme's own foreground (syntaxColors.default); the custom `text` key does
# not reach it and hunk 0.19 has no key for it. dark-plus (#d4d4d4) and
# vitesse-light (#393a34) are the bundled bases closest to oxide text
# (#cecece / #333333). Bases without a foreground entry (e.g. min-dark)
# fall back to #ffffff / #000000.

[themes.oxide-dark]
label = "Oxide Dark"
base = "dark-plus"
background = "#161616"
panel = "#121212"
panelAlt = "#222222"
border = "#3a3a3a"
accent = "#3ba6f5"
accentMuted = "#2e2e2e"
text = "#cecece"
