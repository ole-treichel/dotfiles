## COLORSCHEME: oxide light
# Generated from oxide/colors.txt. Monochrome per oxide UI_COLOR_GUIDE:
# accents only for state (prefix active = blue, activity = yellow, bell = red).
# Only the current window gets a background (surface1).
# mantle #eeeeee  base #f5f5f5  surface0 #e4e4e4  surface1 #d4d4d4  surface2 #c4c4c4
# bright_text #1b1b1b  text #333333  subtext0 #4d4d4d  subtext1 #777777  subtext2 #a4a4a4

set-option -g status "on"
set -g status-interval 2

# Bar takes the terminal background; only the current window is highlighted.
set-option -g status-style fg='#4d4d4d',bg=default
# Legacy aliases override status-style for the fill; clear values left by
# earlier themes on a running server.
set-option -gu status-bg
set-option -gu status-fg

# copy-mode selection, choose-tree highlight
set-option -g mode-style fg='#333333',bg='#d4d4d4'

# ---- Windows ----
set-window-option -g window-status-style fg='#777777',bg=default
set-window-option -g window-status-current-style fg='#1b1b1b',bg='#d4d4d4'
set-window-option -g window-status-activity-style fg='#8a6200',bg=default
set-window-option -g window-status-bell-style fg='#af3c3a',bg=default

# ---- Pane ----
set-option -g pane-border-style fg='#a4a4a4'
set-option -g pane-active-border-style fg='#333333'
set-option -g display-panes-active-colour '#1b1b1b'
set-option -g display-panes-colour '#777777'

# ---- Command ----
set-option -g message-style fg='#333333',bg='#e4e4e4'
set-option -g message-command-style fg='#333333',bg='#e4e4e4'

# ---- Popups and menus ----
set-option -g popup-style fg='#333333',bg='#f5f5f5'
set-option -g popup-border-style fg='#c4c4c4'
set-option -g menu-style fg='#333333',bg='#e4e4e4'
set-option -g menu-selected-style fg='#1b1b1b',bg='#d4d4d4'
set-option -g menu-border-style fg='#c4c4c4'

# ---- Miscellaneous ----
set-window-option -g clock-mode-colour '#333333'

# ---- Formatting ----
set-option -g status-left-style none
set -g status-left-length 60
set -g status-left '#{?client_prefix,#[fg=#f5f5f5#,bg=#006eb8#,bold],#[fg=#1b1b1b#,bold]} #S #[default]#[fg=#777777] #(whoami) #[default] '

set-option -g status-right-style none
set -g status-right-length 150
set -g status-right '#[fg=#4d4d4d] %Y-%m-%d  %H:%M #[fg=#1b1b1b,bold] #h '

set -g window-status-separator ''
set -g window-status-format ' #I  #W '
set -g window-status-current-format ' #I  #[bold]#W '
