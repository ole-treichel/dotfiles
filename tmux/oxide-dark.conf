## COLORSCHEME: oxide dark
# Generated from oxide/colors.txt. Monochrome per oxide UI_COLOR_GUIDE:
# accents only for state (prefix active = blue, activity = yellow, bell = red).
# Only the current window gets a background (surface1).
# mantle #121212  base #161616  surface0 #222222  surface1 #2e2e2e  surface2 #3a3a3a
# bright_text #eeeeee  text #cecece  subtext0 #aeaeae  subtext1 #808080  subtext2 #555555

set-option -g status "on"
set -g status-interval 2

# Bar takes the terminal background; only the current window is highlighted.
set-option -g status-style fg='#aeaeae',bg=default
# Legacy aliases override status-style for the fill; clear values left by
# earlier themes on a running server.
set-option -gu status-bg
set-option -gu status-fg

# copy-mode selection, choose-tree highlight
set-option -g mode-style fg='#cecece',bg='#2e2e2e'

# ---- Windows ----
set-window-option -g window-status-style fg='#808080',bg=default
set-window-option -g window-status-current-style fg='#eeeeee',bg='#2e2e2e'
set-window-option -g window-status-activity-style fg='#c39900',bg=default
set-window-option -g window-status-bell-style fg='#ed756e',bg=default

# ---- Pane ----
set-option -g pane-border-style fg='#555555'
set-option -g pane-active-border-style fg='#cecece'
set-option -g display-panes-active-colour '#eeeeee'
set-option -g display-panes-colour '#808080'

# ---- Command ----
set-option -g message-style fg='#cecece',bg='#222222'
set-option -g message-command-style fg='#cecece',bg='#222222'

# ---- Popups and menus ----
set-option -g popup-style fg='#cecece',bg='#161616'
set-option -g popup-border-style fg='#3a3a3a'
set-option -g menu-style fg='#cecece',bg='#222222'
set-option -g menu-selected-style fg='#eeeeee',bg='#2e2e2e'
set-option -g menu-border-style fg='#3a3a3a'

# ---- Miscellaneous ----
set-window-option -g clock-mode-colour '#cecece'

# ---- Formatting ----
set-option -g status-left-style none
set -g status-left-length 60
set -g status-left '#{?client_prefix,#[fg=#161616#,bg=#3ba6f5#,bold],#[fg=#eeeeee#,bold]} #S #[default]#[fg=#808080] #(whoami) #[default] '

set-option -g status-right-style none
set -g status-right-length 150
set -g status-right '#[fg=#aeaeae] %Y-%m-%d  %H:%M #[fg=#eeeeee,bold] #h '

set -g window-status-separator ''
set -g window-status-format ' #I  #W '
set -g window-status-current-format ' #I  #[bold]#W '
